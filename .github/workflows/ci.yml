name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the one in flight, so a run of
# commits doesn't tie up a self-hosted runner with work nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: build · vet · test
    # Pushes run on our own runner (see ci/runner), pull requests never do:
    # treeline is public, so a fork PR is untrusted code and must not execute
    # on hardware we own. CI_RUNS_ON names the runner's label — while it is
    # unset everything falls back to a GitHub-hosted runner, because a
    # self-hosted label nothing answers leaves runs queued indefinitely
    # rather than failing.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || (vars.CI_RUNS_ON || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Several tests skip when a tool is missing rather than failing, which
      # on a bare self-hosted runner would quietly shrink the suite. Say so.
      - name: Check optional tools
        run: |
          for t in git tmux sh; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "$t: $(command -v "$t")"
            else
              echo "::warning::$t is missing — the tests that need it will skip"
            fi
          done

      - name: gofmt
        run: |
          unformatted=$(gofmt -l main.go internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: DEBUG tab close flake
        continue-on-error: true
        run: go test -count=30 -failfast -run TestIDETabCloseClick ./internal/ui/

      - name: go test
        run: go test -count=1 ./...

      # internal/ui is left out on purpose: closing a pane races inside
      # charmbracelet/x/vt, where Emulator.closed is a plain bool that Close
      # writes while Read and Write read it. Every session-closing test trips
      # it, so racing that package would gate CI on an upstream fix. Put it
      # back once x/vt synchronizes that flag.
      - name: go test -race (all but internal/ui)
        run: go test -race -count=1 $(go list ./... | grep -v '/internal/ui$')

  # Every push to main that passes the checks above cuts a patch release:
  # v0.17.0 -> v0.17.1. Tagging is the whole release here — the Homebrew tap
  # builds from the tag's source tarball — so this job tags, writes release
  # notes, and bumps the formula's url and sha256.
  #
  # Say [minor] or [major] in the commit message to bump that segment
  # instead, or [skip release] to land on main without publishing.
  release:
    name: tag · release · tap
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Releases are serialised: two of them racing would both read the same
    # latest tag and try to cut the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags aren't fetched by default, and the next version is read off
          # the newest one.
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail

          message=$(git log -1 --pretty=%B)
          if printf '%s' "$message" | grep -qiF '[skip release]'; then
            echo "commit asks to skip the release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<<"${latest#v}"

          if printf '%s' "$message" | grep -qiF '[major]'; then
            major=$((major + 1)); minor=0; patch=0
          elif printf '%s' "$message" | grep -qiF '[minor]'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          next="v$major.$minor.$patch"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists"
            exit 1
          fi

          echo "$latest -> $next"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" --title "$NEXT" --generate-notes

      # Cross-repo, so the job's own GITHUB_TOKEN can't do it: this needs a
      # secret with contents:write on markcipolla/homebrew-tap. The tag and
      # the release are already out by the time we get here, so a failure
      # leaves a half-done release: published, but with the formula still on
      # the old version. That's worth a red run and a message saying exactly
      # what to finish by hand — a warning here goes unread.
      - name: Bump the Homebrew formula
        if: steps.version.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is unset. $NEXT is tagged and released, but Formula/treeline.rb still points at the previous version — set the secret (contents:write on markcipolla/homebrew-tap), then bump the formula by hand."
            exit 1
          fi

          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${NEXT}.tar.gz"
          # The tarball is generated on demand; retry so a release that has
          # only just been tagged doesn't 404 the bump.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 -o source.tar.gz "$url"; then break; fi
            echo "tarball not ready yet (attempt $attempt)"
            sleep 5
          done
          sha=$(sha256sum source.tar.gz | cut -d' ' -f1)

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/markcipolla/homebrew-tap.git" tap
          cd tap
          formula=Formula/treeline.rb
          # Anchored on the field names so only those two lines can move.
          sed -i -E "s|^(  url ).*|\1\"${url}\"|" "$formula"
          sed -i -E "s|^(  sha256 ).*|\1\"${sha}\"|" "$formula"
          git diff --quiet "$formula" && { echo "formula already current"; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "treeline $NEXT"
          # An expired or under-scoped token only shows up here, as a git
          # auth error — name the cause rather than leaving exit 128 to
          # speak for itself.
          if ! git push; then
            echo "::error::pushing to markcipolla/homebrew-tap failed — HOMEBREW_TAP_GITHUB_TOKEN is probably expired or missing contents:write. $NEXT is tagged and released already; bump Formula/treeline.rb by hand (url + sha256 of the tag tarball)."
            exit 1
          fi
