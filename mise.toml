[tools]
go = "1.24"

# hot-reload: rebuild and restart treeline whenever a .go file changes
# (needs watchexec: brew install watchexec). `mise run dev` here runs it
# against this repo; to point it at another repo, run scripts/hot-reload
# from that repo's directory instead.
[tasks.dev]
run = '{{config_root}}/scripts/hot-reload'

# install: build and put the binary at ~/.local/bin/treeline (PATH-stable
# regardless of which mise go is active — see the script for why not
# `go install`)
[tasks.install]
run = '{{config_root}}/scripts/install'
